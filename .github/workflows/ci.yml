name: CI Pipeline - Sistema CA-SI 🚀

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- JOB 1: TESTES UNITÁRIOS (O que você quer ver!) ---
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    - name: Instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Testar Auth Service (Jest)
      run: |
        cd auth-service
        npm install
        npm test

    - name: Testar Events Service (Jest)
      run: |
        cd events-service
        npm install
        npm test

  # --- JOB 2: BUILD BACKEND (Docker) ---
  build-backend:
    needs: unit-tests  # IMPORTANTE: Só roda se os testes passarem!
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    - name: Montar o Docker Compose
      run: docker compose build

  # --- JOB 3: BUILD FRONTEND (React) ---
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    - name: Instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências do Frontend
      run: |
        cd frontend-casi
        npm install

    - name: Compilar o React (Build)
      run: |
        cd frontend-casi
        npm run build